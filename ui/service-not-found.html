<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KiPIDA 服务</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
  font-size: 13px;
  background: #F5F5F5;
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.icon { font-size: 40px; margin-bottom: 12px; }
.title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #222; }
.desc { color: #666; text-align: center; line-height: 1.6; margin-bottom: 12px; max-width: 400px; }
.steps { color: #555; text-align: left; line-height: 2.0; margin-bottom: 16px; max-width: 400px; font-size: 12px; }
.section-title { font-size: 12px; color: #999; margin-bottom: 8px; }
.btn-group { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
.btn {
  padding: 7px 16px;
  font-size: 12px;
  border: 1px solid #D0D0D0;
  border-radius: 4px;
  background: #FFF;
  color: #333;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: #F0F0F0; border-color: #007AFF; color: #007AFF; }
.btn-download {
  background: #34C759;
  border-color: #34C759;
  color: #FFF;
  padding: 8px 20px;
  font-size: 13px;
}
.btn-download:hover { background: #2DB84D; border-color: #2DB84D; color: #FFF; }
.btn-python {
  background: #3776AB;
  border-color: #3776AB;
  color: #FFF;
  padding: 8px 20px;
  font-size: 13px;
}
.btn-python:hover { background: #2D5F8A; border-color: #2D5F8A; color: #FFF; }
.btn-primary {
  background: #007AFF;
  border-color: #007AFF;
  color: #FFF;
  padding: 8px 20px;
  font-size: 13px;
  border-radius: 4px;
}
.btn-primary:hover { background: #0066DD; border-color: #0066DD; color: #FFF; }
</style>
</head>
<body>
<div class="icon">⚠️</div>
<div class="title" id="titleText"></div>
<div class="desc" id="descText"></div>
<div class="steps" id="stepsText"></div>

<div class="btn-group">
  <button class="btn btn-python" onclick="openPython()" id="btnPython"></button>
  <button class="btn btn-download" onclick="downloadPackage()" id="btnDownload"></button>
  <button class="btn btn-primary" onclick="retry()" id="btnRetry"></button>
</div>

<script>
(function() {
  'use strict';
  var i18n = {
    zh: {
      title: 'KiPIDA 服务未启动',
      desc: '请按以下步骤配置并启动 KiPIDA 分析服务：',
      steps: '1. 下载并安装 Python 3.10+（如已安装可跳过）\n2. 下载启动脚本压缩包并解压，Windows 运行 start.bat，Linux 运行 start-linux.sh，macOS 运行 start-macos.sh\n3. 服务启动成功后点击"重新检测"',
      btn_python: '1. 安装 Python',
      btn_download: '2. 下载启动脚本',
      btn_retry: '3. 重新检测'
    },
    en: {
      title: 'KiPIDA Service Not Running',
      desc: 'Please follow these steps to configure and start the KiPIDA analysis service:',
      steps: '1. Download and install Python 3.10+ (skip if already installed)\n2. Download the startup script ZIP and extract it. Windows: run start.bat; Linux: run start-linux.sh; macOS: run start-macos.sh\n3. Click "Retry" after the service starts successfully',
      btn_python: '1. Install Python',
      btn_download: '2. Download Script',
      btn_retry: '3. Retry'
    }
  };

  var lang = 'zh';
  var T = i18n[lang];

  function applyI18n() {
    document.getElementById('titleText').textContent = T.title;
    document.getElementById('descText').textContent = T.desc;
    document.getElementById('stepsText').innerText = T.steps;
    document.getElementById('btnPython').textContent = T.btn_python;
    document.getElementById('btnDownload').textContent = T.btn_download;
    document.getElementById('btnRetry').textContent = T.btn_retry;
    document.title = T.title;
  }

  applyI18n();

  function getEda() {
    try {
      if (window.parent && window.parent.eda) return window.parent.eda;
      if (window.top && window.top.eda) return window.top.eda;
      if (window.eda) return window.eda;
    } catch (e) {}
    return null;
  }

  (function detectLang() {
    var retries = 0;
    function tryDetect() {
      var eda = getEda();
      if (eda && eda.sys_I18n) {
        eda.sys_I18n.getCurrentLanguage().then(function(edaLang) {
          if (edaLang && edaLang.indexOf('zh') === -1) {
            lang = 'en';
            T = i18n[lang];
            applyI18n();
          }
        }).catch(function() {});
      } else if (++retries < 20) {
        setTimeout(tryDetect, 200);
      }
    }
    tryDetect();
  })();

  window.openPython = function() {
    var eda = getEda();
    if (eda && eda.sys_Window) {
      eda.sys_Window.open('https://www.python.org/downloads/');
    }
  };

  window.downloadPackage = function() {
    var base = 'https://raw.githubusercontent.com/easyeda/eext-kipida-integration/main/kipida-service/';
    // Windows (.bat) + Linux (.sh) + macOS (.sh) launchers in one archive.
    var files = ['start.bat', 'start-linux.sh', 'start-macos.sh'];
    Promise.all(files.map(function(name) {
      return fetch(base + name).then(function(r) {
        if (!r.ok) throw new Error('fetch failed: ' + name);
        return r.text();
      }).then(function(content) {
        return { name: name, content: content };
      });
    })).then(function(entries) {
      var blob = buildZip(entries);
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'kipida-service.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }).catch(function() {
      var eda = getEda();
      if (eda && eda.sys_Window) {
        eda.sys_Window.open('https://github.com/easyeda/eext-kipida-integration/tree/main/kipida-service');
      }
    });
  };

  // 构建 STORE 模式 ZIP（不压缩），让浏览器和杀毒软件不再把单个 .bat 当可疑下载。
  // entries: [{ name: string, content: string }]
  function buildZip(entries) {
    var enc = new TextEncoder();
    var parts = [];        // 文件数据区（local header + name + data）
    var centralParts = []; // 中央目录区
    var offset = 0;        // 当前 local header 在文件中的偏移

    entries.forEach(function(entry) {
      var nameBytes = enc.encode(entry.name);
      var dataBytes = enc.encode(entry.content);
      var crc = crc32(dataBytes);

      var localHeader = new ArrayBuffer(30);
      var lh = new DataView(localHeader);
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0, true);
      lh.setUint16(8, 0, true);
      lh.setUint16(10, 0, true);
      lh.setUint16(12, 0, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, dataBytes.length, true);
      lh.setUint32(22, dataBytes.length, true);
      lh.setUint16(26, nameBytes.length, true);
      lh.setUint16(28, 0, true);
      parts.push(localHeader, nameBytes, dataBytes);

      var central = new ArrayBuffer(46);
      var cd = new DataView(central);
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true);
      cd.setUint16(6, 20, true);
      cd.setUint16(8, 0, true);
      cd.setUint16(10, 0, true);
      cd.setUint16(12, 0, true);
      cd.setUint16(14, 0, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, dataBytes.length, true);
      cd.setUint32(24, dataBytes.length, true);
      cd.setUint16(28, nameBytes.length, true);
      cd.setUint16(30, 0, true);
      cd.setUint16(32, 0, true);
      cd.setUint16(34, 0, true);
      cd.setUint16(36, 0, true);
      cd.setUint32(38, 0, true);
      cd.setUint32(42, offset, true);
      centralParts.push(central, nameBytes);

      offset += 30 + nameBytes.length + dataBytes.length;
    });

    var centralSize = centralParts.reduce(function(sum, p) {
      return sum + (p.byteLength !== undefined ? p.byteLength : p.length);
    }, 0);

    var eocd = new ArrayBuffer(22);
    var e = new DataView(eocd);
    e.setUint32(0, 0x06054b50, true);
    e.setUint16(4, 0, true);
    e.setUint16(6, 0, true);
    e.setUint16(8, entries.length, true);
    e.setUint16(10, entries.length, true);
    e.setUint32(12, centralSize, true);
    e.setUint32(16, offset, true);
    e.setUint16(20, 0, true);

    return new Blob(parts.concat(centralParts, [eocd]), { type: 'application/zip' });
  }

  var _crcTable = null;
  function crc32(bytes) {
    if (!_crcTable) {
      _crcTable = new Uint32Array(256);
      for (var i = 0; i < 256; i++) {
        var c = i;
        for (var j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        _crcTable[i] = c >>> 0;
      }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) crc = (_crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8)) >>> 0;
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  window.retry = function() {
    var eda = getEda();
    if (eda && eda.sys_MessageBus) {
      eda.sys_MessageBus.publish('kipida-service-dialog', { type: 'retry' });
    }
  };
})();
</script>
</body>
</html>
